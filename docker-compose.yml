# Anchors
x-app-common: &app-common
  image: quantum-forge:latest
  env_file:
    - .env
  shm_size: 2gb
  networks:
    - quantum_network

services:
  etl:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum_etl
    user: root
    entrypoint: ["/etl_entrypoint.sh"]
    volumes:
      - data_raw:/app/data/raw
      - data_processed:/app/data/processed
      - chroma_storage:/app/data/chroma_storage
      - colbert_index:/app/data/colbert_index
    profiles:
      - etl

  bot:
    <<: *app-common
    container_name: quantum_bot
    restart: unless-stopped
    volumes:
      - data_processed:/app/data/processed:ro
      - chroma_storage:/app/data/chroma_storage:ro
      - colbert_index:/app/data/colbert_index:ro
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: quantum_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quantum_network

volumes:
  data_raw:
  data_processed:
  chroma_storage:
  colbert_index:
  redis_data:
  app_logs:

networks:
  quantum_network:
    driver: bridge
